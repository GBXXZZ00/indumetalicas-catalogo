<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111214">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="icon" type="image/png" href="assets/img/icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Entrar · Indumetálicas El Omnipotente</title>
<link rel="stylesheet" href="assets/css/base.css?v=1">
<link rel="stylesheet" href="assets/css/tema-omni.css?v=1">
<style>
  body{min-height:100dvh;display:flex;flex-direction:column}
  .pin{flex:1;display:flex;flex-direction:column;align-items:center;padding:calc(36px + var(--safe-t)) 24px calc(24px + var(--safe-b));text-align:center}
  .pin img{width:116px;height:116px;border-radius:50%;box-shadow:0 12px 30px rgba(0,0,0,.5)}
  .pin h1{font-family:"BarlowC",sans-serif;font-weight:800;font-size:28px;text-transform:uppercase;letter-spacing:.4px;margin:18px 0 0}
  .pin p{margin:4px 0 0;color:var(--ink-soft);font-size:15px}
  .puntos{display:flex;gap:14px;margin-top:24px;transition:transform 140ms var(--ease-out)}
  .puntos i{width:14px;height:14px;border-radius:50%;border:2px solid #5A5F64;transition:background-color 120ms var(--ease-out),border-color 120ms var(--ease-out)}
  .puntos i.on{background:var(--accent);border-color:var(--accent)}
  .puntos.mal{animation:temblor 320ms var(--ease-out)}
  @keyframes temblor{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  .msg{min-height:22px;margin-top:12px;font-size:14px;font-weight:600;color:#FF8A80}
  .teclado{display:grid;grid-template-columns:repeat(3,76px);gap:14px 26px;margin-top:10px}
  .teclado button{width:76px;height:76px;border-radius:50%;background:var(--surface-2);color:var(--ink);font-family:"BarlowC",sans-serif;font-size:30px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:transform 110ms var(--ease-out),background-color 110ms var(--ease-out)}
  .teclado button:active{transform:scale(0.92);background:#33373B}
  .teclado .vacio{visibility:hidden}
  .teclado .borrar{background:transparent}
  .cargando .teclado{opacity:.45;pointer-events:none}
  .ver{margin-top:auto;padding-top:22px;font-size:14px;font-weight:600;color:var(--ink-soft);text-decoration:none}
</style>
</head>
<body>
<main class="pin" id="pin">
  <img src="assets/img/omni-logo.png" alt="Indumetálicas El Omnipotente">
  <h1>Mi catálogo</h1>
  <p>Escribe tu PIN de 6 números</p>
  <div class="puntos" id="puntos" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="msg" id="msg" role="alert"></div>
  <div class="teclado" id="teclado">
    <button type="button" data-t="1">1</button><button type="button" data-t="2">2</button><button type="button" data-t="3">3</button>
    <button type="button" data-t="4">4</button><button type="button" data-t="5">5</button><button type="button" data-t="6">6</button>
    <button type="button" data-t="7">7</button><button type="button" data-t="8">8</button><button type="button" data-t="9">9</button>
    <span class="vacio"></span><button type="button" data-t="0">0</button>
    <button type="button" class="borrar" data-t="borrar" aria-label="Borrar"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12z"/><path d="M17 9l-5 6M12 9l5 6"/></svg></button>
  </div>
  <a class="ver" href="index.html">Ver el catálogo de clientes</a>
</main>
<script src="assets/vendor/supabase.js?v=1"></script>
<script src="assets/js/supabase-client.js?v=1"></script>
<script src="assets/js/sesion.js?v=1"></script>
<script>
(function(){
  'use strict';
  const $ = (id) => document.getElementById(id);
  let pin = '';
  let ocupado = false;
  // Si ya entró en este teléfono, directo a su catálogo
  window.Sesion.sesionActual().then(s => { if(s) location.replace('catalogo.html'); });
  function pintar(){ [...$('puntos').children].forEach((d, i) => d.classList.toggle('on', i < pin.length)); }
  async function probar(){
    ocupado = true;
    $('pin').classList.add('cargando');
    $('msg').textContent = '';
    try{
      await window.Sesion.entrar(pin);
      location.replace('catalogo.html');
    } catch(e){
      const sinRed = !navigator.onLine || /fetch|network/i.test((e && e.message) || '');
      $('msg').textContent = sinRed ? 'Sin conexión. Revisa tu internet e intenta otra vez.' : 'PIN incorrecto. Intenta otra vez.';
      $('puntos').classList.remove('mal'); void $('puntos').offsetWidth; $('puntos').classList.add('mal');
      pin = ''; pintar();
    } finally {
      ocupado = false;
      $('pin').classList.remove('cargando');
    }
  }
  $('teclado').addEventListener('click', (e) => {
    const b = e.target.closest('[data-t]');
    if(!b || ocupado) return;
    const t = b.dataset.t;
    if(t === 'borrar') pin = pin.slice(0, -1);
    else if(pin.length < 6) pin += t;
    $('msg').textContent = '';
    pintar();
    if(pin.length === 6) probar();
  });
})();
</script>
</body>
</html>
